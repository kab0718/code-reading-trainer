<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Reading Trainer</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">CODE READING TRAINER</p>
      <h1>コードを、自分の言葉で説明する。</h1>
      <p id="status" class="status">
        GitHubのソースコード画面を確認しています…
      </p>

      <section id="training-methods">
        <h2>トレーニング方法</h2>
        <button type="button" disabled>おすすめから選ぶ</button>
        <button type="button" id="selection-button">
          選択したコードを読む
        </button>
      </section>

      <form id="selection" hidden novalidate>
        <h2>選択中のコード</h2>
        <pre><code id="selected-code"></code></pre>
        <label for="explanation"
          >このコードが何をしているか、自分の言葉で説明してください</label
        >
        <textarea
          id="explanation"
          rows="8"
          aria-describedby="explanation-count input-error"
          placeholder="目的、主要な処理、分岐や副作用などを説明してみましょう"
        ></textarea>
        <p id="explanation-count" class="character-count"></p>
        <p id="input-error" class="input-error" role="alert"></p>
        <p class="one-attempt-note">
          回答は1回限りです。採点後に回答を書き直したり、再評価したりすることはできません。
        </p>
        <button type="submit" id="evaluation-button" disabled>評価する</button>
      </form>

      <section
        id="evaluation-result"
        class="evaluation-result"
        aria-labelledby="evaluation-result-title"
        aria-live="polite"
        hidden
      >
        <div class="result-heading">
          <div>
            <p class="result-kicker">EVALUATION RESULT</p>
            <h2 id="evaluation-result-title">採点結果</h2>
          </div>
          <p class="total-score">
            <span class="total-score-label">総合点</span>
            <span id="total-score-value" class="total-score-value"></span>
            <span class="total-score-maximum">/ 100点</span>
          </p>
        </div>

        <div class="result-block">
          <h3>観点別の得点</h3>
          <ul id="criteria-list" class="criteria-list"></ul>
        </div>

        <div class="feedback-groups">
          <section class="feedback-group feedback-group--strength">
            <h3>良かった点</h3>
            <ul id="strengths-list" class="feedback-list"></ul>
          </section>
          <section class="feedback-group feedback-group--gap">
            <h3>不足していた点</h3>
            <ul id="gaps-list" class="feedback-list"></ul>
          </section>
        </div>

        <div class="result-block answer-review">
          <h3>回答を比べる</h3>
          <div class="answer-comparison">
            <section class="answer-panel answer-panel--user">
              <h4>あなたの回答</h4>
              <p id="user-answer" class="answer-text"></p>
            </section>
            <section class="answer-panel answer-panel--model">
              <h4>模範解答</h4>
              <p id="model-answer" class="answer-text"></p>
            </section>
          </div>
        </div>
      </section>
    </main>
    <script src="input-validation.js"></script>
    <script src="evaluation-config.js"></script>
    <script src="evaluation-contract.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
